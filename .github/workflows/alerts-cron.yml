name: Daily alerts

on:
  schedule:
    - cron: "17 11 * * *" # 6:17 AM New York (EST)
  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Run alert job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NYC_OPEN_DATA_APP_TOKEN: ${{ secrets.NYC_OPEN_DATA_APP_TOKEN }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
        run: python -m app.alerts.job
