name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=app --cov-report=term-missing

  accessibility:
    runs-on: ubuntu-latest
    needs: test
    # Remove continue-on-error once the UI is in place.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e .
      - name: Start app
        run: |
          uvicorn app.main:app --port 8000 &
          sleep 5
      - name: axe accessibility check
        run: npx --yes @axe-core/cli http://localhost:8000 --exit
